<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>localStorage 簡單範例</title>
</head>
<body>
  <h1>📝 小小記事本（localStorage 範例）</h1>

  <p>請輸入一些文字，按下「儲存」，再試試看重新整理頁面：</p>

  <input id="note-input" type="text" placeholder="想記住的文字" style="width: 280px;">
  <button id="save-btn">儲存</button>

  <p id="display">目前還沒有儲存任何文字。</p>

  <script>
    const KEY = 'my-note';
    const input = document.getElementById('note-input');
    const saveBtn = document.getElementById('save-btn');
    const display = document.getElementById('display');

    // 第一次進來頁面時，先試著把舊資料拿出來
    const saved = localStorage.getItem(KEY);
    if (saved) {
      input.value = saved;
      display.textContent = '目前儲存的文字：' + saved;
    }

    // 按下儲存，就把文字存進 localStorage
    saveBtn.addEventListener('click', function () {
      const text = input.value;
      localStorage.setItem(KEY, text);
      display.textContent = text
        ? '目前儲存的文字：' + text
        : '目前還沒有儲存任何文字。';
    });
  </script>
</body>
</html>
